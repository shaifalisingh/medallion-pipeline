name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # requirements-ci.txt deliberately excludes apache-airflow -- see
      # tests/test_pipeline.py's module docstring for why.
      - run: pip install -r requirements-ci.txt
      - run: pytest tests/test_pipeline.py -v -s
