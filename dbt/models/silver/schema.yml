version: 2

models:
  - name: slv_311_requests
    description: One row per NYC 311 service request, deduped on request_id.
    columns:
      - name: request_id
        tests:
          - unique
          - not_null
      - name: created_at
        tests:
          - not_null
      - name: agency
        tests:
          - not_null

  - name: slv_commits
    description: One row per GitHub commit SHA, deduped.
    columns:
      - name: commit_sha
        tests:
          - unique
          - not_null
      - name: authored_at
        tests:
          - not_null

  - name: rejected_311_requests
    description: 311 records that failed validation (missing id/agency/created_at), quarantined with a reason.
    columns:
      - name: rejection_reason
        tests:
          - not_null

  - name: rejected_commits
    description: Commit records that failed validation (missing sha/authored_at), quarantined with a reason.
    columns:
      - name: rejection_reason
        tests:
          - not_null

  - name: slv_sec_filings
    description: One row per SEC filing (accession number), deduped -- the search API can return multiple matched documents per filing.
    columns:
      - name: accession_number
        tests:
          - unique
          - not_null
      - name: cik
        tests:
          - not_null
      - name: file_date
        tests:
          - not_null

  - name: rejected_sec_filings
    description: SEC filing records that failed validation (missing accession number/cik/file_date), quarantined with a reason.
    columns:
      - name: rejection_reason
        tests:
          - not_null
